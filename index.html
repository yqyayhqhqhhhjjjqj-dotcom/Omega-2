    <style>
        body {
            font-family: Arial;

        #messages {

            margin: auto;

        input {

<body>

<h1>Mini Omegle</h1>

<div id="messages">Esperando conexión...</div>

<input id="text" placeholder="Escribe un mensaje...">

<button onclick="find()">🔄 Nueva persona</button>
