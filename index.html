<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mini Omegle</title>
    <style>
        body {
            font-family: Arial;
            background: #111;
            color: white;
            text-align: center;
        }
        #messages {
            width: 90%;
            height: 300px;
            border: 1px solid #555;
            margin: auto;
            overflow-y: auto;
            padding: 10px;
            background: #222;
        }
        input {
            width: 80%;
            padding: 10px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
        }
    </style>
</head>

<body>

    <h1>Mini Omegle</h1>

    <div id="messages">Esperando conexión...</div>

    <form id="form">
        <input id="input" placeholder="Escribe un mensaje...">
    </form>

    <br>
    <button id="connect">Comenzar</button>
    <button id="next">Siguiente</button>
    <button id="disconnect">Salir</button>

    <p>Servidor: wss://omega-2-misy.onrender.com</p>

    <script src="script.js"></script>
</body>
</html>
